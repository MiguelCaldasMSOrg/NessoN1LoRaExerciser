name: Build Arduino sketch

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run firmware regression checks
        shell: bash
        run: python3 tests/regressions.py

      - name: Install and run Arduino Lint
        shell: bash
        env:
          ARDUINO_LINT_VERSION: 1.3.0
          ARDUINO_LINT_SHA256: 181671ca174988f2601e1cdf2b40a552682db8eaa047de33117e67e70338b63e
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/arduino-lint"
          archive="$RUNNER_TEMP/arduino-lint.tar.gz"
          download_url="https://downloads.arduino.cc/arduino-lint/arduino-lint_${ARDUINO_LINT_VERSION}_Linux_64bit.tar.gz"

          mkdir -p "$install_dir"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --output "$archive" "$download_url"
          echo "${ARDUINO_LINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir" arduino-lint
          chmod +x "$install_dir/arduino-lint"

          "$install_dir/arduino-lint" --version
          "$install_dir/arduino-lint" --compliance strict --library-manager false --project-type sketch

      - name: Set up Arduino CLI
        shell: bash
        env:
          ARDUINO_CLI_VERSION: 1.5.1
          ARDUINO_CLI_SHA256: 28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/arduino-cli"
          archive="$RUNNER_TEMP/arduino-cli.tar.gz"
          download_url="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"

          mkdir -p "$install_dir"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --output "$archive" "$download_url"
          echo "${ARDUINO_CLI_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir" arduino-cli
          chmod +x "$install_dir/arduino-cli"
          echo "$install_dir" >> "$GITHUB_PATH"

          "$install_dir/arduino-cli" version

      - name: Install board core and libraries
        shell: bash
        env:
          ESP32_BOARD_MANAGER_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          set -euo pipefail

          arduino-cli core update-index --additional-urls "$ESP32_BOARD_MANAGER_URL"
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls "$ESP32_BOARD_MANAGER_URL"
          arduino-cli lib install "Arduino_Nesso_N1@1.0.0" "RadioLib@7.7.1"

      - name: Compile Nesso N1 sketch
        shell: bash
        run: arduino-cli compile --clean --fqbn esp32:esp32:arduino_nesso_n1 .